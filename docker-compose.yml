version: '3.8'

services:
  postgres_db:
    image: postgres:16-alpine # Using a lightweight, stable version
    container_name: node_postgres_local
    restart: always
    environment:
      POSTGRES_USER: node_user
      POSTGRES_PASSWORD: node_secure_password
      POSTGRES_DB: fullstack_db
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data

volumes:
  pg_data:
